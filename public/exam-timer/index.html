<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exam Timer</title>
<meta name="author" content="Yun-Sheng Hu">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js" onload="window.mathReady && mathReady()"></script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23888' stroke-width='3'/%3E%3Cpath d='M16 9v8l5 3' fill='none' stroke='%23888' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root {
  /* Apple's near-black ink and greys on white. Hierarchy comes from size, weight and grey, not from boxes. */
  --bg: #ffffff; --raised: #ffffff;
  --fg: #1d1d1f; --fg2: #424245; --dim: #6e6e73; --faint: #8e8e93;
  --line: rgba(29, 29, 31, .14); --track: rgba(29, 29, 31, .1); --fill: rgba(29, 29, 31, .06);
  --hl: #ffe066;  /* highlighter yellow: light enough to read through, strong enough for a projector */
  --orange: #ff9500; --red: #ff3b30; --on-orange: #1d1d1f; --on-red: #ffffff;
  --accent: #0071e3;
  --band: #1d1d1f; --on-band: #f5f5f7; --band-dim: #a1a1a6;  /* key guide: a dark strip, so "not full screen" is obvious */
  --ease: cubic-bezier(.22, 1, .36, 1);  /* quick start, long soft landing */
  --sans: system-ui, -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", Roboto, sans-serif;
  --digits: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
/* Light unless T switches to dark; a projected exam room should not change with the laptop's own setting. */
:root[data-theme="dark"] {
  --bg: #0e0e0f; --raised: #545458;
  --fg: #f5f5f7; --fg2: #d2d2d7; --dim: #a1a1a6; --faint: #7c7c80;
  --line: rgba(255, 255, 255, .14); --track: rgba(255, 255, 255, .15); --fill: rgba(255, 255, 255, .09);
  --hl: #ffd60a;
  --orange: #ff9f0a; --red: #ff453a;
  --accent: #0a84ff;
  --band: #1c1c1e;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; letter-spacing: inherit; }
b, strong { font-weight: 600; }

/* ── Motion ────────────────────────────────────────────────────────────────
   New text "inks in": it settles onto the page from a soft blur. Theme changes fade instead of flashing. */
@keyframes ink { from { opacity: 0; filter: blur(6px); transform: translateY(var(--rise, .4em)); } }
.ink { animation: ink .7s var(--ease) var(--delay, 0s) both; }
.clock.ink { --rise: .06em; }  /* the clock is huge: a small rise in its own em */
.theming, .theming *, .theming *::before, .theming *::after {
  transition: background-color .5s ease, color .5s ease, border-color .5s ease, opacity .5s ease !important;
}

/* ── Setup: the cover page of an exam paper ────────────────────────────── */
#setup { min-height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; padding: 56px 24px; }
#form { width: 100%; max-width: 720px; font-size: 18px; line-height: 1.45; }
.topline {
  display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
  color: var(--dim); font-size: 14px; padding-bottom: 12px; border-bottom: 2px solid var(--fg);
}
.topline b { font-family: var(--digits); font-weight: 500; color: var(--fg); font-variant-numeric: tabular-nums; margin-left: .4em; }
#form h1 { font-size: 56px; line-height: 1.05; font-weight: 600; letter-spacing: -.022em; margin: 0; padding-top: 30px; }
.byline { margin: 0; padding: 10px 0 26px 2px; color: var(--dim); font-size: 15px; letter-spacing: .01em; }
.row {
  display: grid; grid-template-columns: 7.5em 1fr; align-items: baseline; gap: 6px 20px; padding: 15px 0;
  border-top: 1px solid var(--line); transition: border-color .2s;
}
.row .label { color: var(--dim); font-size: 16px; font-weight: 500; transition: color .2s; }
.row:focus-within .label { color: var(--fg); }
.row input { width: 100%; border: 0; border-radius: 0; background: none; outline: none; padding: 0; font-size: 20px; font-weight: 500; letter-spacing: -.01em; }
.row input::placeholder { color: var(--faint); font-weight: 400; opacity: .75; }
/* segmented control: the white thumb slides to the chosen option */
.choices {
  --i: 0; position: relative; display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; justify-self: start;
  padding: 2px; border-radius: 9px; background: var(--fill);
}
.choices::before {
  content: ""; position: absolute; top: 2px; bottom: 2px; left: 2px; width: calc(50% - 2px); border-radius: 7px;
  background: var(--raised); box-shadow: 0 1px 3px rgba(0, 0, 0, .12), 0 0 0 .5px rgba(0, 0, 0, .05);
  transform: translateX(calc(var(--i) * 100%)); transition: transform .4s var(--ease);
}
.choices button {
  position: relative; border: 0; background: none; padding: 5px 22px; cursor: pointer; white-space: nowrap;
  color: var(--dim); font-size: 16px; font-weight: 500; transition: color .2s;
}
.choices button[aria-checked="true"] { color: var(--fg); }
.choices button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 7px; }
.times { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.times input {
  width: 4.1em; padding: 3px 0; border-radius: 8px; background: var(--fill); text-align: center;
  font-family: var(--digits); font-variant-numeric: tabular-nums; transition: box-shadow .2s;
}
.times input:focus { box-shadow: 0 0 0 2px var(--accent); }
.times .to { color: var(--dim); font-size: 16px; }
.hint { color: var(--dim); font-size: 15px; margin-left: 6px; }
.hint.error { color: var(--red); }
.preview { margin-top: 14px; font-size: 15px; line-height: 1.6; color: var(--dim); }
.preview .callout { color: var(--fg); font-weight: 600; margin-bottom: 6px; }
.preview ol { margin: 0; padding-left: 1.3em; }
.preview li::marker { color: var(--faint); }
.actions {
  display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;
  padding-top: 26px; border-top: 1px solid var(--line);
}
.actions .note { color: var(--dim); font-size: 14px; }
.go {
  border: 0; border-radius: 980px; padding: 12px 34px; background: var(--accent); color: #fff;
  font-size: 17px; font-weight: 600; cursor: pointer; transition: transform .15s var(--ease), filter .2s;
}
.go:hover { filter: brightness(1.08); }
.go:active { transform: scale(.97); }
.go:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
@media (max-width: 600px) {
  #setup { padding: 32px 16px; }
  .topline { flex-wrap: wrap; }
  .row { grid-template-columns: 1fr; padding: 12px 0; }
  .preview .nb { white-space: normal; }  /* the projector's line-break hints are too long for a phone */
  #form h1 { font-size: 42px; }
  .go { width: 100%; }
}

/* ── Display ───────────────────────────────────────────────────────────── */
#show { height: 100%; display: flex; flex-direction: column; background: var(--bg); }
.stage { flex: 1; min-height: 0; container-type: size; position: relative; }
.tip {  /* a small dark HUD, like the volume indicator */
  position: absolute; left: 50%; bottom: 28px; z-index: 60; padding: 9px 18px; border-radius: 980px;
  background: rgba(29, 29, 31, .86); color: #f5f5f7; font-size: 15px; font-weight: 500; pointer-events: none;
  -webkit-backdrop-filter: blur(20px) saturate(1.6); backdrop-filter: blur(20px) saturate(1.6);
  opacity: 0; transform: translate(-50%, 8px) scale(.97); transition: opacity .35s, transform .35s var(--ease);
}
.tip.on { opacity: 1; transform: translate(-50%, 0); transition-duration: .2s; }
.display {
  /* same proportions as the terminal version (about 90 columns × 26 rows) */
  --row: 1.4em; --col: .6em;
  height: 100%; font-size: min(1.85cqw, 2.9cqh); line-height: 1.4;  /* = --row, but scales with the left side */
  display: grid; grid-template-rows: auto 1fr; overflow: hidden;
}
/* top line: three small labelled values, like the heading of an answer sheet */
.info {
  display: grid; grid-template-columns: 1fr auto 1fr; gap: 2em; align-items: end; white-space: nowrap;
  padding: calc(var(--row) * .75) calc(var(--col) * 3.5) calc(var(--row) * .7); border-bottom: 1px solid var(--line);
}
.info[data-n="2"] { grid-template-columns: 1fr 1fr; }
.info[data-n="1"] { grid-template-columns: 1fr; text-align: center; }
.info .item { display: grid; min-width: 0; }
.info[data-n="3"] .item:nth-child(2) { text-align: center; }
.info .item:last-child:not(:first-child) { text-align: right; }
.info .label { color: var(--dim); font-size: .66em; font-weight: 500; line-height: 1.4; }
.info .value { font-size: 1.08em; font-weight: 600; letter-spacing: -.012em; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; }
.cols { display: grid; grid-template-columns: 42% 58%; min-height: 0; }
.left { min-height: 0; overflow: hidden; padding: calc(var(--row) * 1.3) calc(var(--col) * 2.5) var(--row) calc(var(--col) * 3.5); }
.right { position: relative; display: grid; grid-template-rows: 1fr auto 1fr; justify-items: center; min-height: 0; overflow: hidden; }
.credit {  /* the author, signed small in the corner under the clock, level with the end of the column rule */
  position: absolute; right: calc(var(--col) * 3.5); bottom: calc(var(--row) * 1.15); pointer-events: none;
}
.credit span { display: block; color: var(--faint); font-size: .74em; font-weight: 500; line-height: 1; letter-spacing: .01em; white-space: nowrap; }  /* the size of the small labels */
.right::before {  /* the column rule stops short of the edges, as on a printed page */
  content: ""; position: absolute; left: 0; top: calc(var(--row) * 1.3); bottom: calc(var(--row) * 1.3); border-left: 1px solid var(--line);
}

.leftin { width: fit-content; max-width: 100%; font-size: calc(var(--left-scale, 1) * 1em); }
.title { color: var(--dim); font-size: .72em; font-weight: 600; letter-spacing: .015em; margin-bottom: calc(var(--row) * .4); }
/* the one thing that must not be missed: set as the headline of the rules, not boxed */
.left .callout {
  font-size: 1.3em; line-height: 1.22; font-weight: 600; letter-spacing: -.015em; text-wrap: balance;
  padding-bottom: calc(var(--row) * .75); margin-bottom: calc(var(--row) * .85); border-bottom: 1px solid var(--line);
}
.callout[hidden] + .rules { margin-top: calc(var(--row) * .55); }
.rules { list-style: none; margin: 0; padding: 0; display: grid; gap: calc(var(--row) * .7); }
.rules li { display: grid; grid-template-columns: .9em 1fr; gap: .75em; align-items: baseline; }
.rules .num { color: var(--faint); font-weight: 500; font-variant-numeric: tabular-nums; }
.rules .head { font-weight: 600; text-wrap: balance; }
.rules .body { color: var(--fg2); text-wrap: pretty; }
.rules .body b { color: var(--fg); }
.hl, .rules .body .hl {
  color: var(--fg); background: linear-gradient(transparent 40%, var(--hl) 40%, var(--hl) 86%, transparent 86%);  /* lower half of the letters */
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
}
/* on dark, a see-through yellow turns olive: a solid band with dark text instead, like a real marker */
:root[data-theme="dark"] .hl, :root[data-theme="dark"] .rules .body .hl { color: #1d1d1f; background: var(--hl); }
:root[data-theme="dark"] .hl b { color: inherit; }
.nb { white-space: nowrap; }
.notesbox { margin-top: calc(var(--row) * 1.9); }
.notesbox .title { margin-bottom: calc(var(--row) * .5); }
.notes { list-style: none; margin: 0; padding: 0; display: grid; gap: calc(var(--row) * .45); }
.notes li { position: relative; display: grid; grid-template-columns: 3.2em 1fr; gap: .6em; align-items: baseline; }
.notes li.new::before {  /* posted in the last 10 minutes: a blue dot, like an unread mail */
  content: ""; position: absolute; left: -.85em; top: calc(var(--row) / 2 - .19em); width: .38em; height: .38em; border-radius: 50%; background: var(--accent);
}
.notes .stamp { color: var(--faint); font-variant-numeric: tabular-nums; }
.notes .ntext { color: var(--fg2);  /* not ".text": KaTeX uses that class for \\text{} */ overflow-wrap: anywhere; text-wrap: pretty; }
.notes .fresh { color: var(--fg); font-weight: 600; }
.notes .katex { font-size: 1.08em; }
.notes .katex-display, .mathpreview .katex-display { margin: .25em 0; }  /* KaTeX's own 1em is too roomy here */
.notes .katex, .mathpreview .katex { overflow-wrap: normal; }  /* "break anywhere" is for long words, not formulas */
.draftrow { display: grid; gap: .3em; min-width: 0; }
.mathpreview { color: var(--fg2); overflow-wrap: anywhere; }
.mathpreview:empty { display: none; }
.notes input { width: 100%; border: 0; border-bottom: 2px solid var(--accent); background: none; outline: none; padding: 0; font-weight: 600; line-height: var(--row); caret-color: var(--accent); }
.notes input::placeholder { color: var(--faint); font-weight: 400; }
.earlier { color: var(--faint); font-size: .85em; margin-bottom: calc(var(--row) * .5); }
.compact .title { margin-bottom: calc(var(--row) * .3); }
.compact .rules { gap: calc(var(--row) * .4); }
.compact .left .callout { padding-bottom: calc(var(--row) * .45); margin-bottom: calc(var(--row) * .5); }
.compact .notesbox { margin-top: var(--row); }
.compact2 .rules { gap: calc(var(--row) * .15); }
.compact2 .notes { gap: 0; }

.above { align-self: end; display: flex; flex-direction: column; align-items: center; padding-bottom: calc(var(--row) * 2); }
.below { align-self: start; display: flex; flex-direction: column; align-items: center; padding-top: calc(var(--row) * 2); }
.tlabel { color: var(--dim); font-size: .72em; font-weight: 600; letter-spacing: .015em; margin-bottom: var(--row); }
.range, .clock { font-family: var(--digits); font-stretch: 88%; font-variant-numeric: tabular-nums; white-space: nowrap; line-height: .8; }
.range { font-size: var(--range-fs, 2em); font-weight: 300; color: var(--fg2); letter-spacing: -.01em; }
.range.small { font-family: var(--sans); font-weight: 600; font-stretch: 100%; font-size: 1em; line-height: var(--row); letter-spacing: 0; }
.clock { --digit: var(--fg); font-size: var(--clock-fs, 8em); font-weight: 600; letter-spacing: -.02em; }
.clock .sec { --digit: var(--faint); }  /* hours and minutes in ink, the seconds a step back */
/* each changed digit rolls up: the old one rises and fades, the new one comes up from below */
.clock .d { display: inline-block; position: relative; color: var(--digit); }
.clock .d.roll { color: transparent; }
.clock .d.roll::before, .clock .d.roll::after { position: absolute; inset: 0; color: var(--digit); }
.clock .d.roll::before { content: attr(data-old); animation: digit-out .5s var(--ease) both; }
.clock .d.roll::after { content: attr(data-new); animation: digit-in .5s var(--ease) both; }
@keyframes digit-out { to { opacity: 0; transform: translateY(-.28em); filter: blur(.03em); } }
@keyframes digit-in { from { opacity: 0; transform: translateY(.28em); filter: blur(.03em); } }
.bar { height: calc(var(--row) * .24); width: var(--clock-w, 20em); background: var(--track); border-radius: 99px; position: relative; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--fg); border-radius: 99px; transition: width .6s linear, background-color .4s; }
.status {
  margin-top: calc(var(--row) * 1.3); padding: .3em 1.2em; border-radius: 980px;
  color: var(--dim); font-weight: 500; transition: background-color .4s, color .4s;
}
.soon .bar i { background: var(--orange); }
.final .bar i, .over .bar i { background: var(--red); }
.soon .status { background: var(--orange); color: var(--on-orange); font-weight: 600; }
.final .status, .over .status { background: var(--red); color: var(--on-red); font-weight: 600; }
.measure { position: absolute; visibility: hidden; white-space: nowrap; left: -9999px; top: 0; }

/* ── Key guide (hidden in full screen) ─────────────────────────────────── */
.guide {
  display: flex; gap: 14px 28px; align-items: center; padding: 12px 18px;
  background: var(--band); color: var(--band-dim); font-size: 14px; border-top: 1px solid var(--line);
}
.guide .keys { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: center; }
.guide .pair { display: inline-flex; gap: 4px; align-items: center; }
.guide .keys button { border: 0; background: none; padding: 0; cursor: pointer; color: var(--band-dim); display: inline-flex; gap: 8px; align-items: center; transition: color .2s; }
.guide .keys button:hover { color: var(--on-band); }
.guide .fsbtn {
  flex: none; border: 0; border-radius: 980px; padding: 9px 10px 9px 16px; cursor: pointer;
  background: var(--accent); color: #fff; font-size: 15px; font-weight: 600;
  display: inline-flex; gap: 10px; align-items: center; transition: transform .15s var(--ease), filter .2s;
}
.guide .fsbtn:hover { filter: brightness(1.1); }
.guide .fsbtn:active { transform: scale(.97); }
.guide .fsbtn svg { width: 15px; height: 15px; }
.guide kbd {
  font-family: var(--sans); font-size: 12px; font-weight: 500; min-width: 22px; padding: 2px 6px; text-align: center;
  border-radius: 5px; color: var(--on-band); background: rgba(255, 255, 255, .14);
}
.guide .fsbtn kbd { color: #fff; background: rgba(255, 255, 255, .24); }
@media (max-width: 760px) { .guide { flex-direction: column; align-items: stretch; } .guide .fsbtn { justify-content: center; } }
.fs .guide { display: none; }

@media (prefers-reduced-motion: reduce) {
  .ink, .clock .d.roll::before, .clock .d.roll::after { animation: none !important; }
  .clock .d.roll::before { opacity: 0; }
  .bar i, .choices::before { transition: none; }
}
</style>
</head>
<body>

<section id="setup">
  <form id="form" autocomplete="off" novalidate>
    <div class="topline"><span id="today"></span><span><span data-t="nowLabel"></span><b id="nowClock"></b></span></div>
    <h1 data-t="formTitle"></h1>
    <p class="byline">By Yun-Sheng Hu</p>

    <div class="row" id="langSeg" role="radiogroup">
      <span class="label" data-t="langLabel"></span>
      <div class="choices">
        <button type="button" role="radio" data-v="en">English</button>
        <button type="button" role="radio" data-v="zh">中文</button>
      </div>
    </div>
    <label class="row"><span class="label" data-t="course"></span><input type="text" name="course" data-ph="coursePh"></label>
    <label class="row"><span class="label" data-t="examName"></span><input type="text" name="exam" data-ph="examPh"></label>
    <label class="row"><span class="label" data-t="prof"></span><input type="text" name="prof" data-ph="profPh"></label>
    <div class="row">
      <span class="label" data-t="time"></span>
      <div class="times">
        <input type="text" name="start" inputmode="numeric" maxlength="5" placeholder="14:20" aria-label="start">
        <span class="to" data-t="to"></span>
        <input type="text" name="end" inputmode="numeric" maxlength="5" placeholder="16:10" aria-label="end">
        <span class="hint" id="timeHint"></span>
      </div>
    </div>
    <div class="row" id="rulesSeg" role="radiogroup">
      <span class="label" data-t="rulesLabel"></span>
      <div>
        <div class="choices">
          <button type="button" role="radio" data-v="quiz"><span data-t="quiz"></span></button>
          <button type="button" role="radio" data-v="exam"><span data-t="exam"></span></button>
        </div>
        <div class="preview" id="preview"></div>
      </div>
    </div>

    <div class="actions">
      <span class="note" data-t="formSub"></span>
      <button type="submit" class="go"><span data-t="go"></span></button>
    </div>
  </form>
</section>

<section id="show" hidden>
  <div class="stage">
    <div class="tip" id="tip" role="status"></div>
    <div class="display" id="display">
      <header class="info" id="info"></header>
      <div class="cols">
        <div class="left" id="left">
          <div class="leftin" id="leftin">
            <div class="title" id="rtitle"></div>
            <div class="callout" id="callout"></div>
            <ol class="rules" id="rules"></ol>
            <div class="notesbox" id="notesbox" hidden>
              <div class="title" data-d="notes"></div>
              <div class="earlier" id="earlier" hidden></div>
              <ul class="notes" id="notes"></ul>
            </div>
          </div>
        </div>
        <div class="right" id="right">
          <div class="credit"><span>By Yun-Sheng Hu</span></div>
          <div class="above">
            <div class="tlabel" id="tlabel"></div>
            <div class="range" id="range"></div>
          </div>
          <div class="clock" id="clock">00:00:00</div>
          <div class="below">
            <div class="bar"><i id="barFill"></i></div>
            <div class="status" id="status"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <footer class="guide" id="guide"></footer>
</section>

<span class="measure" id="measure"></span>

<script>
"use strict";
// ── Content ──────────────────────────────────────────────────────────────
// Rules: "headline :: detail" (headline bold, detail under it); "! text" is a callout above the
// numbered list; **bold**; | marks where Chinese may break.
const RULE_SETS = {
  quiz: {
    en: [
      "Remember to darken your class. ::",
      "No electronic devices and no calculators. ::",
      "==Do NOT use your own scratch paper (計算紙).== ::",
      "No cheating! ::",
    ],
    zh: [
      "記得塗黑|班級欄位。 ::",
      "不得使用任何|電子設備|（包含計算機）。 ::",
      "==不得使用|自行攜帶的|計算紙。== ::",
      "嚴禁作弊。 ::",
    ],
  },
  exam: {
    en: [

// ── State (kept only while the page is open — nothing is saved) ───────────
const LEFT_SCALE = { quiz: 1, exam: 0.85 };  // starting text size of the left column, per rule set
const S = { lang: "en", ruleset: "quiz", rulesPicked: false, course: "", exam: "", prof: "", leftScale: { ...LEFT_SCALE },
            start: "", end: "", notes: [], notesFor: "", draft: null, running: false };
const $ = id => document.getElementById(id);
const T = () => TEXT[S.lang];
const esc = t => t.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// "**bold**" and "|" break hints → HTML. With hints, each piece between | stays on one line.
const TAGS = { "**": ["<b>", "</b>"], "==": ['<span class="hl">', "</span>"] };  // ==…== is a highlighter mark
function markup(s) {
  const hinted = s.includes("|"), open = [];
  let out = "", piece = "";
  const opens = list => list.map(k => TAGS[k][0]).join("");
  const closes = list => [...list].reverse().map(k => TAGS[k][1]).join("");
  const flush = () => { if (piece) out += hinted ? `<span class="nb">${piece}</span>` : piece; piece = ""; };
  for (const tok of s.split(/(\*\*|==|\|)/)) {
    if (TAGS[tok]) {
      const i = open.indexOf(tok);
      if (i < 0) { open.push(tok); piece += TAGS[tok][0]; continue; }
      const inner = open.splice(i);  // close this tag and whatever opened after it, then reopen those
      inner.shift();
      piece += closes(inner) + TAGS[tok][1] + opens(inner);
      open.push(...inner);
    } else if (tok === "|") { piece += closes(open); flush(); piece += opens(open); }
    else piece += esc(tok);
  }
  piece += closes(open);
  flush();
  return out;
}

function parseRules(list) {
  const callouts = [], items = [];
  for (const r of list) {
    if (r.startsWith("!")) { callouts.push(r.slice(1).trim()); continue; }
    const i = r.indexOf("::");
    items.push(i < 0 ? { head: "", body: r.trim() } : { head: r.slice(0, i).trim(), body: r.slice(i + 2).trim() });
  }
  return { callouts, items };
}

function fmtDur(sec) {
  if (sec < 60) return T().dur(0, 0, Math.max(1, Math.ceil(sec)));
  const total = Math.ceil(sec / 60);
  return T().dur(Math.floor(total / 60), total % 60);
}

function minutes(hhmm) { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; }
function at(hhmm, now) { const d = new Date(now); d.setHours(Math.floor(minutes(hhmm) / 60), minutes(hhmm) % 60, 0, 0); return d; }

function examState(now) {
  const s = at(S.start, now), e = at(S.end, now);
  if (now < s) return { state: "before", text: T().before(fmtDur((s - now) / 1000)), pct: 0 };
  if (now < e) {
    const left = (e - now) / 1000;
    const state = left <= RED_AT * 60 ? "final" : left <= ORANGE_AT * 60 ? "soon" : "during";
    return { state, text: T().left(fmtDur(left)), pct: (now - s) / (e - s) };
  }
  return { state: "over", text: T().over, pct: 1 };
}

// ── Setup form ───────────────────────────────────────────────────────────
const form = $("form");

function setSeg(seg, value) {
  const buttons = [...seg.querySelectorAll("button")];
  buttons.forEach(b => b.setAttribute("aria-checked", String(b.dataset.v === value)));
  seg.querySelector(".choices").style.setProperty("--i", buttons.findIndex(b => b.dataset.v === value));  // slides the thumb
}

function renderForm() {
  document.documentElement.lang = S.lang === "zh" ? "zh-Hant" : "en";
  for (const el of form.querySelectorAll("[data-t]")) el.textContent = T()[el.dataset.t];
  for (const el of form.querySelectorAll("[data-ph]")) el.placeholder = T()[el.dataset.ph];
  setSeg($("langSeg"), S.lang);
  setSeg($("rulesSeg"), S.ruleset);
  const { callouts, items } = parseRules(RULE_SETS[S.ruleset][S.lang]);
  $("preview").innerHTML =
    callouts.map(c => `<div class="callout">${markup(c)}</div>`).join("") +
    `<ol>${items.map(it => `<li>${it.head ? `<b>${markup(it.head)}</b> ` : ""}${markup(it.body)}</li>`).join("")}</ol>`;
  checkTimes(false);
}

const pad2 = n => String(n).padStart(2, "0");

// "14:20", "1420", "14：20", "14.20", "9:05", "14" → "HH:MM"; anything else → null
function parseHM(text) {
  const t = text.trim().replace(/[：．.]/g, ":").replace(/\s+/g, "");
  const m = /^(\d{1,2}):(\d{1,2})$/.exec(t) || /^(\d{1,2})(\d{2})$/.exec(t) || /^(\d{1,2})()$/.exec(t);
  if (!m || +m[1] > 23 || +(m[2] || 0) > 59) return null;
  return `${pad2(+m[1])}:${pad2(+(m[2] || 0))}`;
}

function checkTimes(strict) {
  const hint = $("timeHint"), st = parseHM(form.start.value), en = parseHM(form.end.value);
  hint.classList.remove("error");
  if ((form.start.value.trim() && !st) || (form.end.value.trim() && !en)) {
    hint.textContent = T().badFormat; hint.classList.add("error"); return false;
  }
  if (!st || !en) { hint.textContent = strict ? T().needTime : ""; hint.classList.toggle("error", strict); return false; }
  const d = minutes(en) - minutes(st);
  if (d <= 0) { hint.textContent = T().badTime; hint.classList.add("error"); return false; }
  hint.textContent = T().lasts(T().dur(Math.floor(d / 60), d % 60));
  return true;
}

$("langSeg").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  S.lang = b.dataset.v; renderForm();
});
$("rulesSeg").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  S.ruleset = b.dataset.v; S.rulesPicked = true; renderForm();
});
form.exam.addEventListener("input", () => {  // "Quiz 2" → quiz rules, "Midterm" → exam rules, until picked by hand
  if (S.rulesPicked) return;
  const s = form.exam.value.toLowerCase();
  const guess = /quiz|小考|測驗/.test(s) ? "quiz" : /exam|midterm|final|期中|期末|考試/.test(s) ? "exam" : null;
  if (guess && guess !== S.ruleset) { S.ruleset = guess; renderForm(); }
});
for (const input of [form.start, form.end]) {
  input.addEventListener("input", () => checkTimes(false));
  input.addEventListener("blur", () => { const v = parseHM(input.value); if (v) input.value = v; checkTimes(false); });
  input.addEventListener("keydown", e => {  // ↑ / ↓ : 5 minutes, with Shift : 1 hour
    if (e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
    e.preventDefault();
    const v = parseHM(input.value) || (input === form.end && parseHM(form.start.value)) || "12:00";
    const step = (e.shiftKey ? 60 : 5) * (e.key === "ArrowUp" ? 1 : -1);
    const t = (Math.round((minutes(v) + step) / (e.shiftKey ? 1 : 5)) * (e.shiftKey ? 1 : 5) + 1440) % 1440;
    input.value = `${pad2(Math.floor(t / 60))}:${pad2(t % 60)}`;
    checkTimes(false);
  });
}

form.addEventListener("submit", e => {
  e.preventDefault();
  if (!checkTimes(true)) { (parseHM(form.start.value) ? form.end : form.start).focus(); return; }
  Object.assign(S, { course: form.course.value.trim(), exam: form.exam.value.trim(), prof: form.prof.value.trim(),
                     start: parseHM(form.start.value), end: parseHM(form.end.value) });

  if (key !== S.notesFor) { S.notes = []; S.notesFor = key; }  // same exam again: keep its announcements
  startDisplay();
});

(function initTimes() {

(function setupClock() {  // today's date and the computer's time, so a wrong clock is noticed before the exam

// ── Motion ───────────────────────────────────────────────────────────────
// Text that just changed "inks in" (fades up from a soft blur); several elements follow each other.
function inkIn(...els) {
  els.filter(Boolean).forEach((el, i) => {
    el.style.setProperty("--delay", `${i * 70}ms`);
    el.classList.remove("ink");
    void el.offsetWidth;  // restart the animation
    el.classList.add("ink");
  });
}

// Clock: one span per character, so a digit that changes can roll (old one up and out, new one up and in).
// The characters stay the real text; the rolling copies are pseudo-elements.
function setClock(text) {
  const el = $("clock");
  if (el.childElementCount !== text.length) {
    el.innerHTML = [...text].map((c, i) => `<span class="d${i >= text.length - 3 ? " sec" : ""}">${c}</span>`).join("");
    return;
  }
  [...text].forEach((c, i) => {
    const d = el.children[i];
    if (d.textContent === c) return;
    d.dataset.old = d.textContent; d.dataset.new = c; d.textContent = c;
    d.classList.remove("roll"); void d.offsetWidth; d.classList.add("roll");
  });
}

// ── Display ──────────────────────────────────────────────────────────────
let tick = null, wakeLock = null;

function startDisplay() {
  S.running = true;

function backToSetup() {

    `<span>${esc(t.fsTitle)}</span><kbd>F</kbd></button>` +

      k === "+-"
        ? `<span class="pair"><button type="button" data-key="+"><kbd>+</kbd></button>` +

        : `<button type="button" data-key="${k}"><kbd>${k}</kbd><span>${esc(what)}</span></button>`).join("")}</div>`;
  $("display").style.setProperty("--left-scale", S.leftScale[S.ruleset]);

function hhmm(ts) { const d = new Date(ts); return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; }

function renderNotes(force) {
  const list = $("notes"), now = Date.now();
  const typing = S.draft !== null;
  if (typing && !force && list.querySelector("input")) return;  // don't disturb the input while typing
  $("notesbox").hidden = !S.notes.length && !typing;
  const rows = S.notes.map((n, i) => {
    if (typing && S.draft.edit === i) return { input: true, t: n.t };
    return { t: n.t, text: n.text, fresh: (now - n.t) / 1000 < NOTE_FRESH };
  });
  if (typing && S.draft.edit === null) rows.push({ input: true, t: now });
  list.innerHTML = rows.map(r => r.input
    ? `<li><span class="stamp">${hhmm(r.t)}</span><div class="draftrow"><input id="draft" maxlength="${NOTE_MAX}" ` +
      `enterkeyhint="send" placeholder="${esc(T().draftPh)}"><div class="mathpreview" id="draftPreview"></div></div></li>`
    : `<li${r.fresh ? ' class="new"' : ""}><span class="stamp">${hhmm(r.t)}</span><span class="ntext${r.fresh ? " fresh" : ""}" data-raw="${esc(r.text)}">${withMath(r.text)}</span></li>`).join("");
  if (S.inkNote != null && !typing) { inkIn(list.children[S.inkNote]); S.inkNote = null; }  // the one just posted or edited
  const input = $("draft");
  if (input) {
    input.value = S.draft.text;
    const preview = () => {  // shows how the math will look before posting
      $("draftPreview").innerHTML = hasMath(input.value) && window.katex ? withMath(input.value) : "";
      layoutLeft();
    };
    preview();
    input.addEventListener("input", () => { S.draft.text = input.value; preview(); });
    input.addEventListener("keydown", e => {
      if (e.isComposing || e.keyCode === 229) return;  // the input method is still choosing characters
      if (e.key === "Enter") { e.preventDefault(); commitDraft(); }
      else if (e.key === "Escape") { e.preventDefault(); S.draft = null; renderNotes(true); layoutLeft(); }
    });
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
  }
  layoutLeft();
}

// Announcements may contain LaTeX: $…$ or \(…\) inline, $$…$$ or \[…\] on a line of their own (centred, as in
// LaTeX); \$ is a dollar sign.
const MATH = /\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|(?<!\\)\$((?:\\\$|[^$])+?)\$/g;
const hasMath = text => text.search(MATH) >= 0;  // search() ignores and keeps lastIndex, unlike test()

function withMath(text) {
  if (!window.katex) return esc(text);
  let out = "", last = 0;
  MATH.lastIndex = 0;  // matchAll starts from the regex's lastIndex
  for (const m of text.matchAll(MATH)) {
    const display = m[1] != null || m[2] != null;
    const tex = m[1] ?? m[2] ?? m[3] ?? m[4];
    out += esc(text.slice(last, m.index).replace(/\\\$/g, "$"));
    out += katex.renderToString(tex, { displayMode: display, throwOnError: false, strict: "ignore", output: "html" });
    last = m.index + m[0].length;
  }
  return out + esc(text.slice(last).replace(/\\\$/g, "$"));
}

window.mathReady = () => {  // KaTeX arrived after some announcements were drawn: redraw just their text
  for (const el of document.querySelectorAll(".notes .ntext[data-raw]")) el.innerHTML = withMath(el.dataset.raw);
  const input = $("draft");
  if (input) input.dispatchEvent(new Event("input"));
  if (S.running) layoutLeft();
};
document.fonts?.addEventListener?.("loadingdone", () => { if (S.running) layoutLeft(); });  // KaTeX fonts change sizes

function commitDraft() {
  const text = S.draft.text.trim();
  if (S.draft.edit !== null) {
    if (text) { S.notes[S.draft.edit].text = text; S.inkNote = S.draft.edit; }
    else S.notes.splice(S.draft.edit, 1);  // emptied → deleted
  } else if (text) {
    S.notes.push({ t: Date.now(), text });
    S.inkNote = S.notes.length - 1;
  }
  S.draft = null;
  renderNotes(true);
}

// Rules column: start level with the "Exam time" heading when it fits; squeeze the spacing, then
// show only the newest announcements, when it doesn't.
function layoutLeft() {
  const left = $("left"), inner = $("leftin"), disp = $("display");
  let scale = S.leftScale[S.ruleset];
  disp.style.setProperty("--left-scale", scale);
  disp.classList.remove("compact", "compact2");
  const items = [...$("notes").children];
  items.forEach(li => { li.hidden = false; });
  $("earlier").hidden = true;
  const pad = getComputedStyle(left);
  const room = () => left.clientHeight - parseFloat(pad.paddingTop) - parseFloat(pad.paddingBottom);
  const tall = () => inner.getBoundingClientRect().height;
  if (tall() > room()) disp.classList.add("compact");
  if (tall() > room()) disp.classList.add("compact2");
  let hidden = 0;
  while (tall() > room() && hidden < items.length - 1) {
    items[hidden].hidden = true; hidden++;
    $("earlier").hidden = false;
    $("earlier").textContent = T().earlier(hidden);
  }
  while (tall() > room() && scale > .5) {  // still too much: make the text smaller rather than cut it off
    scale = Math.round((scale - .05) * 100) / 100;
    disp.style.setProperty("--left-scale", scale);
  }
  S.leftShown = scale;
}

// Clock as large as the right side allows, the exam time above it at about 40 %.
const measureBox = $("measure");
function textWidth(text, cls) {
  measureBox.className = "measure " + cls;
  measureBox.style.fontSize = "100px";
  measureBox.textContent = text;
  return measureBox.getBoundingClientRect().width / 100;
}

function fit() {
  if (!S.running) return;
  const disp = $("display"), right = $("right");
  const base = parseFloat(getComputedStyle(disp).fontSize), row = base * 1.4, col = base * .602;
  const W = right.clientWidth - col * 4, H = right.clientHeight;
  const cw = textWidth("00:00:00", "clock"), rw = textWidth(`${S.start} – ${S.end}`, "range");
  let fs = W / cw, rfs = 0;
  for (let i = 0; i < 80; i++) {
    rfs = Math.min(fs * .42, (fs * cw * .66) / rw);
    const rangeH = rfs >= base * 1.6 ? rfs * .8 : row;
    const above = row * 2 + rangeH + row * 2;    // heading, blank, range, gap
    const below = row * 2 + row * .5 + row + row * 3;  // gap, bar, blank, status
    if (fs * .8 + 2 * Math.max(above, below) <= H) break;
    fs *= .97;
  }
  disp.style.setProperty("--clock-fs", `${fs}px`);
  disp.style.setProperty("--range-fs", `${rfs}px`);
  disp.style.setProperty("--clock-w", `${fs * cw}px`);
  $("range").classList.toggle("small", rfs < base * 1.6);  // too small to be worth big digits
  layoutLeft();
}

function update() {
  if (!S.running) return;
  const now = new Date();
  const p = n => String(n).padStart(2, "0");
  setClock(`${p(now.getHours())}:${p(now.getMinutes())}:${p(now.getSeconds())}`);
  const st = examState(now);
  $("right").className = "right " + st.state;
  $("barFill").style.width = `${Math.max(0, Math.min(1, st.pct)) * 100}%`;
  $("status").textContent = st.text;
  if (S.draft === null && now.getSeconds() === 0) renderNotes(false);  // fresh → normal weight after 10 min
  tick = setTimeout(update, 1000 - (Date.now() % 1000) + 5);
}

new ResizeObserver(() => fit()).observe($("display"));
function syncFullscreen() {
  const full = !!(document.fullscreenElement || document.webkitFullscreenElement);
  document.body.classList.toggle("fs", full);
}
document.addEventListener("fullscreenchange", syncFullscreen);
document.addEventListener("webkitfullscreenchange", syncFullscreen);
syncFullscreen();

// ── Keys (also clickable in the guide) ───────────────────────────────────
function action(key) {
  if (!S.running) return;
  switch (key) {
    case "F":
      if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
      else {
        const el = document.documentElement;
        const r = (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
        if (r && r.catch) r.catch(() => {});
      }
      break;
    case "L":
      S.lang = S.lang === "en" ? "zh" : "en"; renderStatic(); update();
      inkIn($("info"), $("leftin"), $("tlabel"), $("status"));
      break;
    case "R": S.ruleset = S.ruleset === "quiz" ? "exam" : "quiz"; renderStatic(); inkIn($("leftin")); break;
    case "N": S.draft = { text: "", edit: null }; renderNotes(true); break;
    case "E": if (S.notes.length) { S.draft = { text: S.notes.at(-1).text, edit: S.notes.length - 1 }; renderNotes(true); } break;
    case "D": if (S.notes.length) { S.notes.pop(); renderNotes(true); } break;
    case "T": {  // fade between light and dark rather than flash
      const root = document.documentElement;
      root.classList.add("theming");
      root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
      clearTimeout(themeTimer);
      themeTimer = setTimeout(() => root.classList.remove("theming"), 550);
      break;
    }
    case "Q": backToSetup(); break;
    case "+": case "-": case "0": {
      const now = S.leftScale[S.ruleset];
      const next = key === "0" ? LEFT_SCALE[S.ruleset] : Math.round((now + (key === "+" ? .1 : -.1)) * 100) / 100;
      S.leftScale[S.ruleset] = Math.min(1.6, Math.max(.5, next));
      applyLeftScale(true);
      break;
    }
  }
}

let tipTimer = null, themeTimer = null;
function applyLeftScale(announce) {
  layoutLeft();
  const full = S.leftShown < S.leftScale[S.ruleset];
  if (full) S.leftScale[S.ruleset] = S.leftShown;  // + past what fits does nothing
  if (!announce) return;
  const tip = $("tip");
  tip.textContent = (full ? T().leftMax : T().leftSize)(Math.round(S.leftShown * 100));
  tip.classList.add("on");
  clearTimeout(tipTimer);
  tipTimer = setTimeout(() => tip.classList.remove("on"), 1200);
}

const SIZE_KEYS = { Equal: "+", NumpadAdd: "+", Minus: "-", NumpadSubtract: "-", Digit0: "0", Numpad0: "0" };
document.addEventListener("keydown", e => {
  if (!S.running || e.altKey) return;
  const size = SIZE_KEYS[e.code];
  if (size && (e.metaKey || e.ctrlKey)) { e.preventDefault(); action(size); return; }  // even while typing
  if (e.metaKey || e.ctrlKey) return;
  if (size && S.draft === null && !e.target.closest?.("input")) { e.preventDefault(); action(size); return; }
  if (S.draft !== null) { if (!e.target.closest?.("input")) $("draft")?.focus(); return; }
  if (e.target.closest && e.target.closest("input")) return;
  const m = /^Key([FLRNEDTQ])$/.exec(e.code);  // the physical key, so it works with any input method on
  if (m) { e.preventDefault(); action(m[1]); }
});
$("guide").addEventListener("click", e => {
  const b = e.target.closest("button[data-key]");
  if (b) action(b.dataset.key);
});
window.addEventListener("beforeunload", e => {  // nothing is saved, so ask before closing a running exam
  if (S.running) { e.preventDefault(); e.returnValue = T().leave; }
});
</script>
